<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card bg-black border-0 shadow rounded-4 p-5" style="width: 100%; max-width: 400px;">
        
        <div class="text-center mb-4">
            <h1 class="fs-3 fw-bold text-white">InkReserve</h1>
            <p class="text-secondary">Accede a tu panel de gestión</p>
        </div>


        <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
            Usuario o contraseña incorrectos.
        </div>


        <div th:if="${param.logout}" class="alert alert-success text-center py-2" role="alert">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary">Usuario</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" 
                       id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-secondary">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" 
                       id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold"
                    style="background-color: #00a86b; border: none;">
                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
            </button>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
