<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <div th:replace="~{fragments/Nav :: nav}"></div>

    <div class="container-fluid px-4 py-4">
        <h1 class="fw-semibold my-4 fs-3">Cambiar Contraseña</h1>

        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="card bg-black border-0 shadow rounded-4 p-4">

                    <div th:if="${param.exito}" class="alert alert-success text-center py-2 mb-3" role="alert">
                        <i class="bi bi-check-circle me-2"></i> Contraseña cambiada correctamente.
                    </div>

                    <div th:if="${error}" class="alert alert-danger text-center py-2 mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}">Error</span>
                    </div>

                    <form th:action="@{/cambiar-contrasena}" method="post">
                        <div class="mb-3">
                            <label for="nuevaPassword" class="form-label text-secondary">Nueva contraseña</label>
                            <input type="password"
                                   class="form-control bg-dark text-white border-secondary"
                                   id="nuevaPassword"
                                   name="nuevaPassword"
                                   required>
                        </div>
                        <div class="mb-4">
                            <label for="confirmarPassword" class="form-label text-secondary">Confirmar contraseña</label>
                            <input type="password"
                                   class="form-control bg-dark text-white border-secondary"
                                   id="confirmarPassword"
                                   name="confirmarPassword"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold"
                                style="background-color: #00a86b; border: none;">
                            <i class="bi bi-key me-2"></i> Cambiar contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/FooterApp :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
