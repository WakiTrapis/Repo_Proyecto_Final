<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="modalEliminarArtista" class="modal fade" id="ModalConfirmarEliminarArtista" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
            <div class="modal-content bg-black border border-secondary border-opacity-25 rounded-4 shadow-lg">
                
                <div class="modal-header border-bottom border-dark px-4 py-3">
                    <h5 class="modal-title fw-bold text-white d-flex align-items-center gap-2" id="modalEliminarLabel">
                        <i class="bi bi-exclamation-triangle-fill text-danger"></i> Confirmar Borrado
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body p-4 text-center">
                    <div class="mb-3">
                        <i class="bi bi-trash3 text-danger display-4 opacity-75"></i>
                    </div>
                    <p class="text-white fs-5 fw-semibold mb-2">¿Estás seguro de que deseas eliminar este Artista?</p>
                    <p class="text-secondary small mb-0">Esta acción no se puede deshacer y se desasignar los tatuajes asociados y citas asociadas.</p>
					<p class="text-secondary small mb-0">ASEGURATE DE REASIGNAR LOS TATUAJES Y LAS CITAS</p>
                </div>
                
                <div class="modal-footer border-top border-dark px-4 py-3 justify-content-center gap-2">
                    <button type="button" class="btn btn-outline-secondary fw-medium px-4 py-2" data-bs-dismiss="modal">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="btn btn-danger fw-bold px-4 py-2 shadow-sm">Eliminar Definitivamente</a>
                </div>
            </div>
        </div>
        
        <script>
            
            document.addEventListener("DOMContentLoaded", function() {
                const deleteModal = document.getElementById('ModalConfirmarEliminarArtista');
                if (deleteModal) {
                    deleteModal.addEventListener('show.bs.modal', event => {
                        const button = event.relatedTarget;
                        const id = button.getAttribute('data-bs-id');
                        const confirmBtn = deleteModal.querySelector('#confirmDeleteBtn');
                        
                        confirmBtn.href = '/Dashboard/Artistas/Eliminar/' + id;
                    });
                }
            });
        </script>
    </div>

</body>
</html>
