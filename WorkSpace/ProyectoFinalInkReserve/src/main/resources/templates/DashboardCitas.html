<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    
	<div th:replace="~{fragments/Nav :: nav}"></div>
	
	<div class="container-fluid px-4 py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="fs-3 fw-bold">Citas</h1>
			<button type="button" class="btn btn-success px-4 py-2 fw-bold" style="background-color: #00a86b; border: none;" data-bs-toggle="modal" data-bs-target="#ModalFormCitas">
                <i class="bi bi-plus-lg me-2"></i> Agregar Cita
			</button>
			
		</div>

		<div class="row g-4 justify-content-center">
			
			<div class="col-lg-9">
			    
			    <div class="d-flex justify-content-between align-items-center bg-black p-3 mb-3 rounded-4 shadow-sm border border-secondary border-opacity-25">
			        
			        <a th:href="@{/Dashboard/Citas(fecha=${diaAnteriorStr})}" class="btn btn-outline-secondary border-0 px-3 fs-5 text-white">
			            <i class="bi bi-chevron-left"></i>
			        </a>
			        
			        <div class="d-flex align-items-center gap-3">
			            <h3 class="fs-5 fw-bold m-0 text-capitalize" 
			                th:text="${#temporals.format(fechaActual, 'dd ''de'' MMMM ''de'' yyyy', #locale.forLanguageTag('es'))}">
			                16 de Mayo de 2026
			            </h3>
			            
			            <div class="position-relative">
			                <input type="date" 
			                       id="datepickerRapido" 
			                       th:value="${#temporals.format(fechaActual, 'yyyy-MM-dd')}" 
			                       class="form-control form-control-sm bg-dark border-secondary text-white cursor-pointer"
			                       style="width: 45px; height: 35px; padding: 0 0 0 8px;"
			                       onchange="window.location.href='/Dashboard/Citas?fecha=' + this.value">
			            </div>
			        </div>
			        
			        <a th:href="@{/Dashboard/Citas(fecha=${diaSiguienteStr})}" class="btn btn-outline-secondary border-0 px-3 fs-5 text-white">
			            <i class="bi bi-chevron-right"></i>
			        </a>
			        
			    </div>
				<form th:action="@{/Dashboard/Citas}" method="get" class="d-inline-block align-middle ms-3">
				    <input type="hidden" name="fecha" th:value="${fechaActual}" />
				    
				    <div class="form-check form-switch m-0">
				        <input class="form-check-input bg-dark border-secondary" 
				               type="checkbox" 
				               name="filtro" 
				               value="sinArtista" 
				               id="checkSinArtista"
				               onchange="this.form.submit()"
				               th:checked="${filtroActual == 'sinArtista'}"
				               style="cursor: pointer; width: 2.5em; height: 1.25em;">
				        
				        <label class="form-check-label text-white fw-medium ms-2" for="checkSinArtista" style="cursor: pointer;">
				            Mostrar solo citas sin artista
				        </label>
				    </div>
				</form>
			    <div class="table-responsive table-dark-custom shadow p-3 mb-4">
			        <table class="table table-dark table-hover align-middle mb-0">
			            <thead class="text-secondary small border-bottom border-dark">
			                <tr>
			                    <th>Id</th>
			                    <th>Hora</th>
			                    <th>Tatuaje / Diseño</th>
			                    <th>Cliente</th>
			                    <th>Artista</th>
			                    <th>Precio</th>
			                    <th class="text-center">Acciones</th>
			                </tr>
			            </thead>
			            <tbody>
			                <tr class="border-bottom border-dark" th:each="cita : ${listaCitas}" th:data-clickable-href="@{/Dashboard/Citas(verPerfilId=${cita.id}, fecha=${fechaActual}, filtro=${filtroActual})}"
							 style="cursor: pointer;">
			                    <td class="fw-semibold" th:text="${cita.id}">1</td> 
			                    
			                    <td class="fw-bold text-info" th:text="${#temporals.format(cita.fechaInicio, 'HH:mm') + ' - ' + #temporals.format(cita.fechaFinal, 'HH:mm')}">16:00 - 19:00</td>
			                    
			                    <td th:text="${cita.tatuaje != null ? cita.tatuaje.nombreTatuaje : 'Diseño Eliminado (Historial)'}">Break Brain</td>
			                    <td th:text="${cita.cliente != null ? cita.cliente.nombreCliente : 'Sin cliente'}">Gonzalo Luna</td>
			                    <td th:text="${cita.artista != null ? cita.artista.nombreArtista : 'Artista Eliminado'}">Paco Porras</td>	                    
			                    <td class="fw-bold text-success" th:text="${cita.precioSesion} + '€'">120€</td>
			                    
			                    <td class="text-center">
									<a th:href="@{/Dashboard/Citas(idEditar=${cita.id}, fecha=${fechaActual}, filtro=${filtroActual})}" class="btn btn-outline-info" ><i class="bi bi-pencil"></i></a>
									<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#ModalConfirmarEliminarCita"  th:data-bs-id="${cita.id}">
											<i class="bi bi-trash"></i></button>															
			                    </td>
			                </tr>
			                <tr th:if="${#lists.isEmpty(listaCitas)}">
			                    <td colspan="7" class="text-center text-secondary py-5">
			                        <i class="bi bi-calendar-check fs-2 d-block mb-2 text-muted"></i>
			                        No hay ninguna cita programada para este día.
			                    </td>
			                </tr>
			            </tbody>
			        </table>
			    </div>
			</div>
		 </div> 
		 <div th:replace="~{fragments/FormularioCitas :: modalNuevaCita}"></div>
		 <div th:replace="~{fragments/ConfirmacionEliminarCita :: modalEliminarCita}"></div>
		 <div th:replace="~{fragments/FichaCita :: modalFichaCitas}"></div>
		 
		 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		 <script th:src="@{/js/DashboardUtils.js}"></script>
		 <script th:src="@{/js/CalculoPrecioAuto.js}"></script>
		 <script th:src="@{/js/AutocompletarTatuaje.js}"></script>
		 


		<div th:if="${fichaCita != null}"
		     data-auto-open-modal="ModalFichaCitas">
		</div>
	
		<div th:if="${formularioCita != null && formularioCita.id != null && formularioCita.id != 0}"
		     data-auto-open-modal="ModalFormCitas">
		</div>
	
		<div th:if="${abrirModal}"
		     data-auto-open-modal="ModalFormCitas">
		</div>
		
		<div th:replace="~{fragments/FooterApp :: footer}"></div>
		
	</body>
	</html>
