<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <div th:replace="~{fragments/Nav :: nav}"></div>

    <div class="container-fluid px-4 pb-5">
        <h1 class="fw-semibold my-4 fs-3">Mi Perfil</h1>

        <div class="row g-4">

            <div class="col-12">
                <div class="card bg-black border-0 shadow rounded-4 p-4">
                    <div class="d-flex align-items-center gap-4 flex-wrap">


                        <div th:if="${artista != null}">
                            <img th:src="${artista.fotoArtista}"
                                 class="rounded-4 border border-secondary shadow"
                                 style="width:110px; height:110px; object-fit:cover;"
                                 alt="Foto de perfil">
                        </div>

                        <div th:if="${artista == null}"
                             class="rounded-4 border border-secondary bg-dark d-flex align-items-center 
                                    justify-content-center shadow"
                             style="width:110px; height:110px;">
                            <i class="bi bi-person-fill text-secondary" style="font-size:3rem;"></i>
                        </div>

                        <div>

                            <h2 class="fw-bold text-white mb-1" 
                                th:text="${artista != null ? artista.nombreArtista : #authentication.name}">
                                Nombre
                            </h2>


                            <span th:if="${artista != null}"
                                  class="badge px-3 py-2 small fw-bold text-success me-2"
                                  style="background-color:rgba(0,168,107,.1); border:1px solid #00a86b;"
                                  th:text="${artista.especialidad}">Especialidad</span>


                            <span sec:authorize="hasRole('ADMIN')"
                                  class="badge bg-warning text-dark px-3 py-2 small fw-bold me-2">
                                <i class="bi bi-shield-fill me-1"></i> ADMIN
                            </span>
                            <span sec:authorize="hasRole('USER')"
                                  class="badge bg-secondary px-3 py-2 small fw-bold">
                                <i class="bi bi-person-fill me-1"></i> ARTISTA
                            </span>


                            <p th:if="${artista != null}" 
                               class="text-secondary small mt-2 mb-0">
                                <i class="bi bi-fingerprint me-1"></i> 
                                ID Artista: <span th:text="${artista.id}">0</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${artista != null}">
                <div class="card bg-black border-0 shadow rounded-4 p-4">
                    <h2 class="fs-5 fw-semibold mb-4">Datos Profesionales</h2>
                    <div class="row g-3">

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Precio / Hora
                                </label>
                                <span class="fs-5 fw-bold text-white" 
                                      th:text="${artista.precioHora} + ' €'">0.00 €</span>
                            </div>
                        </div>

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Años de Experiencia
                                </label>
                                <span class="fs-5 fw-bold text-white" 
                                      th:text="${artista.experiencia} + ' años'">0 años</span>
                            </div>
                        </div>

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Nº Higiénico Sanitario
                                </label>
                                <span class="fs-6 fw-bold text-white" 
                                      th:text="${artista.numeroHigienico}">HS-000</span>
                            </div>
                        </div>

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Teléfono de Contacto
                                </label>
                                <span class="fs-6 text-white d-flex align-items-center gap-2 mt-1">
                                    <i class="bi bi-telephone text-secondary"></i>
                                    <span th:text="${artista.telefonoArtista}">000 000 000</span>
                                </span>
                            </div>
                        </div>

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Documento de Identidad (DNI)
                                </label>
                                <span class="fs-6 text-white d-flex align-items-center gap-2 mt-1">
                                    <i class="bi bi-credit-card-2-front text-secondary"></i>
                                    <span th:text="${artista.dniArtista}">00000000X</span>
                                </span>
                            </div>
                        </div>

                        <div class="col-sm-6 col-lg-4">
                            <div class="bg-dark p-3 rounded-3 border border-secondary h-100">
                                <label class="form-label text-secondary small fw-bold d-block mb-1">
                                    Citas Realizadas
                                </label>
                                <span class="fs-5 fw-bold text-white"
                                      th:text="${#lists.size(artista.citas)}">0</span>
                                <span class="text-secondary small ms-1">citas</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card bg-black border-0 shadow rounded-4 p-4">
                    <h2 class="fs-5 fw-semibold mb-3">Seguridad</h2>
                    <p class="text-secondary small mb-3">
                        Mantén tu cuenta segura actualizando tu contraseña periódicamente.
                    </p>
                    <a th:href="@{/cambiar-contrasena}"
                       class="btn btn-outline-success d-inline-flex align-items-center gap-2 px-4 py-2">
                        <i class="bi bi-key-fill"></i> Cambiar Contraseña
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/FooterApp :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
