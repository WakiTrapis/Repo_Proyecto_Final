<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    
	<div th:replace="~{fragments/Nav :: nav}"></div>
	
	<div class="container-fluid px-4 py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="fs-3 fw-bold">Artistas</h1>
			<button type="button" class="btn btn-success px-4 py-2 fw-bold" style="background-color: #00a86b; border: none;" data-bs-toggle="modal" data-bs-target="#ModalFormArtistas">
                <i class="bi bi-plus-lg me-2"></i> Agregar Artista
			</button>
			<div th:replace="~{fragments/FormularioArtistas :: modalNuevoArtista}"></div>
			<div th:replace="~{fragments/ConfirmacionEliminarArtista :: modalEliminarArtista}"></div>
			<div th:replace="~{fragments/PerfilArtista :: modalPerfilArtista}"></div>
		</div>
	</div>
	<div class="row g-4">
		<div class="col-lg-8">
			<div class="table-responsive table-dark-custom shadow p-3">
				<div class="row mb-4">
				    <div class="col-md-6 col-lg-4">
				        <form th:action="@{/Dashboard/Artistas}" method="get" class="input-group">
				            <input type="text" 
				                   name="search" 
				                   th:value="${search}" 
				                   class="form-control bg-dark text-white border-secondary border-opacity-50" 
				                   placeholder="Buscar por nombre o apellidos...">
				            
				            <button class="btn btn-success px-4 fw-bold" type="submit" style="background-color: #00a86b; border: none;">
				                <i class="bi bi-search me-1"></i> Buscar
				            </button>
				            
				            <a th:if="${search != null && !search.isEmpty()}" 
				               th:href="@{/Dashboard/Artistas}" 
				               class="btn btn-outline-secondary d-flex align-items-center justify-content-center border-opacity-50 text-secondary">
				                <i class="bi bi-x-lg"></i>
				            </a>
				        </form>
				    </div>
				</div>
				<table class="table table-dark table-hover align-middle mb-0">
					<thead class="text-secondary small border-bottom border-dark">
						<tr>
							<th>Foto</th>
							<th>Id</th>
							<th>Nombre</th>
							<th>Especialidad</th>
							<th>Experiencia</th>
							<th>€/h</th>
							<th class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr class="border-bottom border-dark clickable-row" th:each="artista : ${listaArtistas}" th:data-href="@{/Dashboard/Artistas(verPerfilId=${artista.id})}" style="cursor: pointer;">
							<td class="py-3 text-center" style="width: 90px;">
								<img th:if="${artista.fotoArtista != null}" 
								     th:src="@{/uploads/{filename}(filename=${artista.fotoArtista})}" 
								     onerror="this.src='/img/no-image.png';"
								     class="rounded-circle" 
								     style="width: 65px; height: 65px; object-fit: cover;" 
								     alt="Avatar">

								<img th:unless="${artista.fotoArtista != null}" 
								     th:src="@{/img/no-image.png}" 
								     class="rounded-circle" 
								     style="width: 65px; height: 65px; object-fit: cover;" 
								     alt="Predeterminado">
							</td>
							<td class="fw-semibold" th:text="${artista.id}">1</td> 
                            <td class="fw-semibold" th:text="${artista.nombreArtista}">Nombre Artista</td>
							<td><span class="badge badge-specialty px-3 text-success" style="background-color: rgba(0, 168, 107, 0.1); border: 1px solid #00a86b;" 
									th:text="${artista.especialidad}">Especialidad</span></td>
							<td th:text="${artista.experiencia} + ' años'">Años de experiencia</td>
							<td th:text="${artista.precioHora} + '€'">€/h</td>
							<td class="text-center action-buttons">
								<a th:href="@{/Dashboard/Artistas(idEditar=${artista.id})}" class="btn btn-outline-info"  data-bs-target="#ModalFormArtistas"><i class="bi bi-pencil"></i></a>
								<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#ModalConfirmarEliminarArtista"  th:data-bs-id="${artista.id}">
									<i class="bi bi-trash"></i></button>
							</td>
						</tr>    
					</tbody>
				</table>
				<nav aria-label="Navegación de artistas" th:if="${totalPages > 1}" class="mt-4">
				    <ul class="pagination justify-content-center gap-1">
				        
				        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
				            <a class="page-link bg-dark text-white border-secondary border-opacity-25 rounded-3 px-3 py-2" 
				               th:href="@{/Dashboard/Artistas(page=${currentPage - 1}, search=${search})}">
				                &laquo; Anterior
				            </a>
				        </li>

				        <li class="page-item" 
				            th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
				            th:classappend="${currentPage == i} ? 'active'">
				            
				            <a class="page-link border-secondary border-opacity-25 rounded-3 px-3 py-2 fw-medium"
				               th:classappend="${currentPage == i} ? 'bg-success text-white border-success' : 'bg-dark text-white'"
				               th:href="@{/Dashboard/Artistas(page=${i}, search=${search})}" 
				               th:text="${i + 1}"
				               th:style="${currentPage == i} ? 'background-color: #00a86b !important; border-color: #00a86b !important;' : ''">
				               1
				            </a>
				        </li>

				        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
				            <a class="page-link bg-dark text-white border-secondary border-opacity-25 rounded-3 px-3 py-2" 
				               th:href="@{/Dashboard/Artistas(page=${currentPage + 1}, search=${search})}">
				                Siguiente &raquo;
				            </a>
				        </li>
				        
				    </ul>
				</nav>
			</div>
		</div>
		<div class="col-lg-4">
            <div class="card bg-black border-0 shadow rounded-4 p-4 h-100">
                <h2 class="fs-5 fw-semibold mb-4">Top Artistas este Mes</h2>
                <div class="d-flex align-items-end justify-content-between h-75 px-2">
                    <div class="bg-success rounded-top" style="width: 40px; height: 90%;"></div>
                    <div class="bg-success rounded-top opacity-75" style="width: 40px; height: 60%;"></div>
                    <div class="bg-success rounded-top opacity-50" style="width: 40px; height: 40%;"></div>
                    <div class="bg-success rounded-top opacity-25" style="width: 40px; height: 20%;"></div>
                </div>
                <div class="d-flex justify-content-between mt-2 text-secondary small px-1">
                    <span>Top</span><span>Art</span><span>Mar</span><span>Mes</span>
                </div>
            </div>
        </div>
	</div>
	
	<div th:replace="~{fragments/FooterApp :: footer}"></div>
	
	<script th:if="${formularioArtista.id != null && formularioArtista.id != 0}">
			window.onload = function() {
				const modalElement = document.getElementById('ModalFormArtistas');
				const myModal = new bootstrap.Modal(modalElement);
				myModal.show();
				modalElement.addEventListener('hidden.bs.modal', function () {
		            window.location.href = '/Dashboard/Artistas';
		        });
			};
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
	    document.addEventListener("DOMContentLoaded", function () {
	        const rows = document.querySelectorAll(".clickable-row");    
	        rows.forEach(row => {
	            row.addEventListener("click", function (e) {
	                if (e.target.closest('.action-buttons') || e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.tagName === 'I') {
	                    return; 
	                }
	                window.location.href = this.dataset.href;
	            });
	        });
	    });
	    </script>

	    <script th:if="${formularioArtista != null && formularioArtista.id != null && formularioArtista.id != 0}">
	        window.onload = function() {
	            const modalElement = document.getElementById('ModalFormArtistas');
	            const myModal = new bootstrap.Modal(modalElement);
	            myModal.show();
	            modalElement.addEventListener('hidden.bs.modal', function () {
	                window.location.href = '/Dashboard/Artistas';
	            });
	        };
	    </script>

	    <script th:if="${perfilArtista != null}">
	        window.onload = function() {
	            const modalElement = document.getElementById('ModalPerfilArtistas'); 
	            if (modalElement) {
	                const myModal = new bootstrap.Modal(modalElement);
	                myModal.show();
	                modalElement.addEventListener('hidden.bs.modal', function () {
	                    window.location.href = '/Dashboard/Artistas';
	                });
	            }
	        };
	    </script>
</body>
</html>
