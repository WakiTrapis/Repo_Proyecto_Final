<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkReserve - Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    
	<div th:replace="fragments/Nav :: nav"></div>
	
	<div class="container-fluid px-4 py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="fs-3 fw-bold">Clientes</h1>
			<button type="button" class="btn btn-success px-4 py-2 fw-bold" style="background-color: #00a86b; border: none;" data-bs-toggle="modal" data-bs-target="#ModalFormClientes">
                <i class="bi bi-plus-lg me-2"></i> Agregar Cliente
			</button>
			<div th:replace="~{fragments/FormularioClientes :: modalNuevoCliente}"></div>
			<div th:replace="~{fragments/ConfirmacionEliminar :: modalEliminarCita}"></div>
		</div>
	</div>
	
	<div class="row g-4">
		<div class="col-lg-8">
			<div class="table-responsive table-dark-custom shadow p-3">
				<table class="table table-dark table-hover align-middle mb-0">
					<thead class="text-secondary small border-bottom border-dark">
						<tr>
							<th>Id</th>
							<th>Nombre</th>
							<th>Teléfono</th>
							<th>Email</th>
							<th class="text-center">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr class="border-bottom border-dark" th:each="cliente : ${listaClientes}">
							<td class="fw-semibold" th:text="${cliente.id}">1</td> 
                            <td class="fw-semibold" th:text="${cliente.nombreCliente}">Nombre Cliente</td>
							<td th:text="${cliente.telefonoCliente}">Teléfono</td>
							<td th:text="${cliente.email}">Email</td>
							<td class="text-center">
								<a th:href="@{/Dashboard/Clientes(idEditar=${cliente.id})}" class="btn btn-outline-info" data-bs-target="#ModalFormClientes"><i class="bi bi-pencil"></i></a>
								<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#ModalConfirmarEliminar"  th:data-bs-id="${cliente.id}"><i class="bi bi-trash"></i></button>
							</td>
						</tr>    
					</tbody>
				</table>
			</div>
		</div>
		<div class="col-lg-4">
            <div class="card bg-black border-0 shadow rounded-4 p-4 h-100">
                <h2 class="fs-5 fw-semibold mb-4">Clientes Nuevos</h2>
                <div class="d-flex align-items-end justify-content-between h-75 px-2">
                    <div class="bg-success rounded-top" style="width: 40px; height: 90%;"></div>
                    <div class="bg-success rounded-top opacity-75" style="width: 40px; height: 60%;"></div>
                    <div class="bg-success rounded-top opacity-50" style="width: 40px; height: 40%;"></div>
                    <div class="bg-success rounded-top opacity-25" style="width: 40px; height: 20%;"></div>
                </div>
                <div class="d-flex justify-content-between mt-2 text-secondary small px-1">
                    <span>Top</span><span>Art</span><span>Mar</span><span>Mes</span>
                </div>
            </div>
        </div>
	</div>
	
	
	<script th:if="${formularioCliente.id != null && formularioCliente.id != 0}">
		    window.onload = function() {
		        var myModal = new bootstrap.Modal(document.getElementById('ModalFormClientes'));
		        myModal.show();
		    };
	</script>
	
	
	
	
	<div th:replace="fragments/FooterApp :: footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
